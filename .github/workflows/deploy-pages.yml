name: Deploy SindCoop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep Pages deployments serialized, but never cancel a valid build that is
# already queued/running. This prevents the GitHub Pages environment from
# repeatedly replacing the deployment with a newer waiting request.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npx --yes npm@11 install --no-audit --no-fund

      - name: Build static SPA for GitHub Pages
        run: npx vite build --config vite.config.github.ts

      - name: Prepare Pages artifact
        run: |
          test -f dist/client/_shell.html
          mkdir -p dist-pages
          cp -R dist/client/. dist-pages/
          cp dist/client/_shell.html dist-pages/index.html
          cp dist/client/_shell.html dist-pages/404.html
          touch dist-pages/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
